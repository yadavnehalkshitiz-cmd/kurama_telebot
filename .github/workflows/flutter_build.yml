name: Flutter Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'           # triggers on tags like v1.0.0, v1.2.3, etc.
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  # ────────────────────────────────────────────────────────
  # 1. BUILD ANDROID APK (Ubuntu — faster & stable for Android)
  # ────────────────────────────────────────────────────────
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./kurama_mobile

      - name: Run Flutter tests
        run: flutter test
        working-directory: ./kurama_mobile

      - name: Analyze Flutter app
        run: flutter analyze --no-fatal-infos
        working-directory: ./kurama_mobile

      - name: Build Android APK
        run: flutter build apk --release --no-tree-shake-icons
        working-directory: ./kurama_mobile

      # Always save artifact (useful for non-release pushes)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuramaBot-Android-APK
          path: kurama_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ────────────────────────────────────────────────────────
  # 2. BUILD WINDOWS EXE
  # ────────────────────────────────────────────────────────
  build_windows:
    name: Build Windows Executable
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Create Windows platform runner
        run: flutter create --platforms=windows .
        working-directory: ./kurama_mobile

      - name: Get dependencies
        run: flutter pub get
        working-directory: ./kurama_mobile

      - name: Build Windows Executable
        run: flutter build windows --release
        working-directory: ./kurama_mobile

      - name: Zip Windows build
        run: Compress-Archive -Path kurama_mobile/build/windows/x64/runner/Release/* -DestinationPath KuramaBot-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KuramaBot-Windows-App
          path: KuramaBot-Windows.zip
          retention-days: 30

  # ────────────────────────────────────────────────────────
  # 3. PUBLISH GITHUB RELEASE (only on version tags: v*)
  # ────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build_android, build_windows]  # wait for both builds
    if: startsWith(github.ref, 'refs/tags/v')  # only runs on tags

    permissions:
      contents: write   # required to create releases

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: KuramaBot-Android-APK
          path: ./release

      - name: Download Windows App
        uses: actions/download-artifact@v4
        with:
          name: KuramaBot-Windows-App
          path: ./release

      - name: Rename APK with version
        run: mv ./release/app-release.apk ./release/KuramaBot-${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🦊 KuramaBot ${{ github.ref_name }}"
          body: |
            ## 🦊 KuramaBot ${{ github.ref_name }}

            Multi-platform video downloader bot — download from YouTube, Instagram, TikTok, Twitter/X, Facebook, and 15+ more sites.

            ### 📥 Downloads
            | Platform | File |
            |---|---|
            | 📱 Android | `KuramaBot-${{ github.ref_name }}.apk` |
            | 💻 Windows | `KuramaBot-Windows.zip` |

            ### 📲 How to install on Android
            1. Download `KuramaBot-${{ github.ref_name }}.apk`
            2. On your phone, go to **Settings → Install unknown apps** and allow your browser/file manager
            3. Open the downloaded APK and tap **Install**

            ### ⚙️ Setup after install
            - Server URL: `https://kurama-telebot.onrender.com`
            - API Key: *(ask the admin)*
          files: |
            ./release/KuramaBot-${{ github.ref_name }}.apk
            ./release/KuramaBot-Windows.zip
          draft: false
          prerelease: false
