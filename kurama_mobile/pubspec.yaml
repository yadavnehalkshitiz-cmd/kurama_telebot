name: kurama_mobile
description: KuramaBot — Multi-platform video downloader for mobile.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  provider: ^6.1.2
  path_provider: ^2.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  share_plus: ^10.0.0
  # 1.9.0 requires the preview Android API 37; keep production builds on API 36.
  receive_sharing_intent: 1.8.1
  flutter_inappwebview: ^6.2.0-beta.3
  video_player: ^2.8.2
  chewie: ^1.7.5
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  local_auth: ^2.1.8
  flutter_local_notifications: ^17.0.0
  workmanager: ^0.9.0+3
  flutter_secure_storage: ^10.3.1
  cryptography: ^2.9.0
  qr_flutter: ^4.1.0
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
